name: 🐛 Reporte de Bug
description: Reporta un error o comportamiento inesperado en el sistema.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este bug. Por favor, completá los campos con la mayor precisión posible.
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: ¿Qué está fallando exactamente?
      placeholder: Al hacer clic en el botón X, la aplicación crashea...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Pasos exactos para que nosotros podamos replicar el error.
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería haber pasado?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno (Opcional)
      description: Sistema operativo, navegador, etc.
      placeholder: Ej. Ubuntu 22.04, Chrome 114
